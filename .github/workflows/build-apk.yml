name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HUBlub-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: "HUBlub Launcher v1.2.0"
          tag_name: "v1.2.0"
          body: |
            ## HUBlub Launcher Android 5.0 Lollipop
            - حزمة أيقونات أندرويد 5 الدائرية (Android 5.0 Round Icons)
            - صوت وتموج قطرة الماء الكلاسيكية
            - ثيم وخلفيات الماتيريال ديزاين 1.0 الأصلية
